<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 카카오맵 검색 서비스</title>
    <style>
        /* 기본 스타일 초기화 및 화면 전체 사용 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽 사이드바 (검색창 + 결과 리스트) */
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 검색 영역 */
        .search-box {
            padding: 15px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .search-form {
            display: flex;
            gap: 5px;
        }
        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-button {
            padding: 8px 15px;
            background-color: #fee500; /* 카카오 시그니처 옐로우 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .search-button:hover {
            background-color: #fada0a;
        }

        /* 검색 결과 리스트 영역 (스크롤 가능) */
        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .result-item {
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .result-item:hover {
            background-color: #e9ecef;
        }
        .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .place-address {
            font-size: 13px;
            color: #6c757d;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 사이드바 -->
        <div class="sidebar">
            <div class="search-box">
                <form class="search-form" id="searchForm">
                    <input type="text" class="search-input" id="keywordInput" placeholder="장소를 검색해보세요 (예: 강남역)" required>
                    <button type="submit" class="search-button">검색</button>
                </form>
            </div>
            <!-- 검색 결과가 동적으로 추가될 곳 -->
            <div class="result-list" id="placesList"></div>
        </div>

        <!-- 오른쪽 지도 -->
        <div class="map-area" id="map"></div>
    </div>

    <!-- 카카오 지도 라이브러리 로드 (autoload=false를 주어 안전하게 로드 후 실행하도록 설정) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a9f1fed1451c1938e05ae1dbae763e15&libraries=services&autoload=false"></script>
    <script>
        // 전역 변수 선언 (지도 객체와 장소 검색 서비스 객체)
        let map;
        let placesService;
        let markers = []; // 생성된 마커들을 관리할 배열

        // 카카오 지도 SDK 로드가 완료된 후 실행되는 함수
        kakao.maps.load(function () {
            const mapContainer = document.getElementById('map');
            
            // 기본 중심 좌표 (위치 권한 거부 시 보여줄 기본값: 서울시청)
            const defaultPosition = new kakao.maps.LatLng(37.5665, 126.9780);
            
            const mapOptions = {
                center: defaultPosition,
                level: 5 // 요청한 지도 확대 레벨
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);
            
            // 장소 검색 객체 초기화
            placesService = new kakao.maps.services.Places();

            // HTML5의 Geolocation(위치 정보) 기능으로 현재 위치 가져오기
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    const lat = position.coords.latitude;  // 위도
                    const lon = position.coords.longitude; // 경도
                    
                    const currentPosition = new kakao.maps.LatLng(lat, lon);
                    
                    // 지도의 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);
                    
                    // 현재 위치에 특별한 마커 하나 표시하기
                    const currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition
                    });
                }, function (error) {
                    console.log("위치 정보를 가져오는데 실패했습니다.", error);
                });
            } else {
                alert("이 브라우저에서는 위치 정보(Geolocation)를 지원하지 않습니다.");
            }

            // 검색 폼 이벤트 리스너 등록
            const searchForm = document.getElementById('searchForm');
            searchForm.addEventListener('submit', function (e) {
                e.preventDefault(); // 폼 제출 시 페이지 새로고침 방지
                const keyword = document.getElementById('keywordInput').value;
                
                if (!keyword.trim()) {
                    alert('키워드를 입력해주세요!');
                    return;
                }
                
                // 카카오맵 장소 검색 API 실행
                placesService.keywordSearch(keyword, placesSearchCB);
            });
        });

        // 장소 검색 완료 시 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 기존에 지도에 있던 마커들과 왼쪽의 결과 리스트를 청소
                clearMapAndList();
                
                // 검색된 장소 위치를 모두 포함할 수 있도록 지도 범위를 재설정하기 위한 객체
                const bounds = new kakao.maps.LatLngBounds();
                const listContainer = document.getElementById('placesList');

                // 검색 결과 개수만큼 반복
                for (let i = 0; i < data.length; i++) {
                    const place = data[i];
                    const placePosition = new kakao.maps.LatLng(place.y, place.x);

                    // 1. 지도에 마커 추가
                    const marker = new kakao.maps.Marker({
                        map: map,
                        position: placePosition
                    });
                    markers.push(marker); // 마커 관리 배열에 저장
                    bounds.extend(placePosition); // 범위 객체에 좌표 추가

                    // 2. 왼쪽에 표시할 HTML 엘리먼트(리스트 아이템) 생성
                    const itemEl = document.createElement('div');
                    itemEl.className = 'result-item';
                    itemEl.innerHTML = `
                        <div class="place-name">${place.place_name}</div>
                        <div class="place-address">${place.road_address_name ? place.road_address_name : place.address_name}</div>
                    `;

                    // 리스트 아이템을 클릭하면 해당 장소로 지도를 부드럽게 이동시키는 이벤트
                    itemEl.addEventListener('click', function() {
                        map.panTo(placePosition);
                    });

                    listContainer.appendChild(itemEl);
                }

                // 검색된 장소들이 한 화면에 다 보이도록 지도 중심 및 레벨 변경
                map.setBounds(bounds);

            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 이전 검색 결과(마커와 리스트)를 지워주는 함수
        function clearMapAndList() {
            // 지도 위 마커 제거
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];

            // 왼쪽 리스트 비우기
            const listContainer = document.getElementById('placesList');
            listContainer.innerHTML = '';
        }
    </script>
</body>
</html>
