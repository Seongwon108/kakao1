<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>
  <style>
    /* 기본 여백 초기화 및 전체 화면 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', dotum, sans-serif;
    }

    /* [조건] 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
    .main-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 왼쪽 영역: 검색창 + 결과 리스트 */
    .sidebar-area {
      width: 360px; /* 왼쪽 영역 너비 고정 */
      height: 100%;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e0e0e0;
      z-index: 10;
    }

    /* 검색창 디자인 */
    .search-box {
      padding: 15px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
    }
    .search-form {
      display: flex;
      gap: 6px;
    }
    .search-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .search-btn {
      padding: 10px 16px;
      background-color: #fee500; /* 카카오 시그니처 노란색 */
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .search-btn:hover {
      background-color: #fada0a;
    }

    /* 검색 결과 리스트 디자인 (결과가 많으면 스크롤 생성) */
    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .result-item {
      padding: 12px;
      background: #ffffff;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #e2e2e2;
      transition: background 0.2s;
    }
    .result-item:hover {
      background-color: #f0f0f0;
    }
    .result-item h5 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #222222;
    }
    .result-item p {
      font-size: 12px;
      color: #666666;
      line-height: 1.4;
    }

    /* [조건] 오른쪽 영역: 지도 */
    .map-area {
      flex: 1; /* 남은 오른쪽 공간을 전부 차지 */
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- 왼쪽: 검색창 및 결과 리스트 -->
    <div class="sidebar-area">
      <div class="search-box">
        <form class="search-form" onsubmit="searchPlaces(); return false;">
          <input type="text" id="keywordInput" class="search-input" value="강남역 맛집" placeholder="검색할 장소를 입력하세요">
          <button type="submit" class="search-btn">검색</button>
        </form>
      </div>
      <div id="placesList" class="results-list"></div>
    </div>

    <!-- 오른쪽: 지도 표시 영역 -->
    <div id="kakaoMap" class="map-area"></div>
  </div>

  <!-- [조건] 카카오 JavaScript 키 적용 및 로딩 오류 방지를 위한 &autoload=false 설정 -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a9f1fed1451c1938e05ae1dbae763e15&libraries=services&autoload=false"></script>
  
  <script>
    // 영어 변수명 선언
    let mapObject;
    let placeSearchService;
    let currentInfowindow = null;

    // [조건] 지도가 완전히 로드된 후에 실행되도록 kakao.maps.load 사용
    kakao.maps.load(function() {
      const mapContainer = document.getElementById('kakaoMap');
      
      // 기본 지도 옵션 설정
      const mapOptions = {
        center: new kakao.maps.LatLng(37.566826, 126.9786567), // 위치 권한 거부 시 보여줄 기본 좌표 (서울시청)
        level: 5 // [조건] 지도 확대 레벨 5 설정
      };

      // 지도 객체 생성
      mapObject = new kakao.maps.Map(mapContainer, mapOptions);
      
      // 장소 검색 서비스 객체 초기화
      placeSearchService = new kakao.maps.services.Places();

      // 인포윈도우 객체 생성 (마커 클릭 시 장소명 표시용)
      currentInfowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // [조건] 페이지가 열리면 위치 권한을 요청하고 현재 위치를 중심으로 설정
      requestUserLocation();
    });

    // 사용자의 현재 위치를 받아오는 함수
    function requestUserLocation() {
      if (navigator.geolocation) {
        // 브라우저에 위치 권한 요청 팝업을 띄움
        navigator.geolocation.getCurrentPosition(function(position) {
          const userLat = position.coords.latitude;  // 위도
          const userLon = position.coords.longitude; // 경도
          
          const currentPosition = new kakao.maps.LatLng(userLat, userLon);
          
          // 지도의 중심을 사용자의 현재 위치로 이동
          mapObject.setCenter(currentPosition);
          
          // 현재 위치에 표시할 마커 생성
          createMarker(currentPosition, '📍 내 현재 위치');
          
        }, function(error) {
          console.warn("위치 권한을 거부하셨거나 위치 정보를 가져올 수 없습니다.", error);
        });
      } else {
        alert("이 브라우저에서는 위치 정보(Geolocation)를 지원하지 않습니다.");
      }
    }

    // 지도 위에 마커와 클릭 이벤트를 만들어주는 공통 함수
    function createMarker(position, placeName) {
      const marker = new kakao.maps.Marker({
        map: mapObject,
        position: position
      });

      // 마커를 클릭하면 장소 이름을 띄우는 이벤트 등록
      kakao.maps.event.addListener(marker, 'click', function() {
        currentInfowindow.setContent('<div style="padding:5px; font-size:12px; max-width:200px; text-align:center;">' + placeName + '</div>');
        currentInfowindow.open(mapObject, marker);
      });

      return marker;
    }

    // 검색 버튼을 누르거나 엔터를 쳤을 때 실행되는 장소 검색 함수
    function searchPlaces() {
      const keyword = document.getElementById('keywordInput').value;

      // 공백만 입력했는지 검사
      if (!keyword.replace(/^\s+|\s+$/g, '')) {
        alert('검색어를 입력해주세요!');
        return false;
      }

      // 카카오 키워드 검색 API 호출
      placeSearchService.keywordSearch(keyword, searchCallback);
    }

    // 검색 결과를 처리하는 콜백 함수
    function searchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        // 성공적으로 결과를 받으면 화면에 리스트와 마커 출력
        displaySearchResults(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 없습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 도중 에러가 발생했습니다.');
      }
    }

    // 검색된 데이터를 바탕으로 리스트와 마커를 그리는 함수
    function displaySearchResults(places) {
      const listContainer = document.getElementById('placesList');
      const mapBounds = new kakao.maps.LatLngBounds();
      
      // 이전 검색 결과 리스트 비우기
      listContainer.innerHTML = '';

      for (let i = 0; i < places.length; i++) {
        const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
        
        // 검색된 장소 마커 찍기
        createMarker(placePosition, places[i].place_name);
        
        // 결과 리스트에 들어갈 HTML 카드 만들기
        const itemElement = document.createElement('div');
        itemElement.className = 'result-item';
        itemElement.innerHTML = `
          <h5>${places[i].place_name}</h5>
          <p>${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</p>
          ${places[i].phone ? `<p style="color: #007bff; margin-top:4px;">${places[i].phone}</p>` : ''}
        `;
        
        // 카드 클릭 시 해당 위치로 지도 이동하고 인포윈도우 열기
        itemElement.onclick = function() {
          mapObject.setCenter(placePosition);
          mapObject.setLevel(3); // 상세히 볼 수 있도록 확대 레벨 변경
        };

        listContainer.appendChild(itemElement);
        
        // 모든 마커가 화면 안에 들어오도록 영역 확장
        mapBounds.extend(placePosition);
      }

      // 검색된 장소들이 한눈에 보이도록 지도 범위 재조정
      mapObject.setBounds(mapBounds);
    }
  </script>
</body>
</html>
