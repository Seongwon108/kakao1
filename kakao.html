<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>
  <style>
    /* 기본 리셋 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', dotum, sans-serif;
    }

    /* 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 왼쪽 사이드바 (검색창 + 결과 리스트) */
    .sidebar {
      width: 350px; /* 사이드바 너비 고정 */
      height: 100%;
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      z-index: 10;
    }

    /* 검색창 영역 */
    .search-box {
      padding: 15px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }
    .search-form {
      display: flex;
      gap: 5px;
    }
    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .search-btn {
      padding: 8px 15px;
      background-color: #fee500; /* 카카오 노란색 */
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .search-btn:hover {
      background-color: #fada0a;
    }

    /* 검색 결과 리스트 영역 (스크롤 가능) */
    .places-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .place-item {
      padding: 12px;
      background: #fff;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      cursor: pointer; /* 마우스 올리면 포인터로 변경 */
      transition: background 0.2s;
    }
    .place-item:hover {
      background-color: #f0f0f0; /* 마우스 올렸을 때 하이라이트 효과 */
    }
    .place-item h5 {
      font-size: 15px;
      margin-bottom: 5px;
      color: #333;
    }
    .place-item p {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }

    /* 오른쪽 지도 영역 */
    .map-area {
      flex: 1; /* 남은 화면 전체 차지 */
      height: 100%;
      background-color: #e5e3df; /* 지도 로드 전 임시 배경색 */
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <div class="search-box">
        <form class="search-form" onsubmit="searchPlaces(); return false;">
          <input type="text" id="keyword" class="search-input" value="이태원 맛집" placeholder="장소를 검색하세요">
          <button type="submit" class="search-btn">검색</button>
        </form>
      </div>
      <!-- 검색 결과가 여기에 동적으로 쌓임 -->
      <div id="placesList" class="places-list"></div>
    </div>

    <!-- 오른쪽 지도 -->
    <div id="map" class="map-area"></div>
  </div>

  <!-- 카카오맵 API 스크립트 (autoload=false를 사용해서 안전하게 로드) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a9f1fed1451c1938e05ae1dbae763e15&libraries=services&autoload=false"></script>
  
  <script>
    // 영어 변수명 사용
    let map;
    let placeService; 
    let markersArray = []; // 생성된 마커들을 관리하고 지우기 위한 배열
    let infoWindowObject; // 단 하나의 인포윈도우만 생성해서 재사용

    // 1. 카카오맵 스크립트 로드 완료 후 실행할 함수
    kakao.maps.load(function() {
      const mapContainer = document.getElementById('map');
      
      // 기본 중심 좌표 (현재 위치를 못 가져올 때를 대비한 기본값: 서울시청)
      const defaultOption = {
        center: new kakao.maps.LatLng(37.566826, 126.9786567),
        level: 5 // 요청한 확대 레벨 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, defaultOption);
      
      // 장소 검색 객체 생성
      placeService = new kakao.maps.services.Places();

      // 인포윈도우 객체 초기화
      infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 현재 위치 가져오기 시도
      getGeoLocation();
    });

    // 2. HTML5의 Geolocation으로 현재 위치 가져오기
    function getGeoLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const lat = position.coords.latitude; // 위도
          const lon = position.coords.longitude; // 경도
          
          const locPosition = new kakao.maps.LatLng(lat, lon);
          
          // 지도의 중심을 현재 위치로 이동
          map.setCenter(locPosition);
          
          // 현재 위치에 마커 표시
          displayMarker(locPosition, '내 현재 위치');
          
        }, function(error) {
          console.error("위치 권한을 거부했거나 가져오지 못했습니다.", error);
        });
      }
    }

    // 마커를 생성하고 배열에 추가하는 공통 함수
    function displayMarker(placePosition, placeName) {
      const marker = new kakao.maps.Marker({
        map: map,
        position: placePosition
      });

      // 마커 클릭 이벤트 등록
      kakao.maps.event.addListener(marker, 'click', function() {
        infoWindowObject.setContent('<div style="padding:5px;font-size:12px;text-align:center;">' + placeName + '</div>');
        infoWindowObject.open(map, marker);
      });

      // 배열에 마커 저장 (나중에 지우기 위함)
      markersArray.push(marker);
      return marker;
    }

    // 기존에 지도에 표시되어 있던 마커들을 전부 지우는 함수
    function clearMarkers() {
      for (let i = 0; i < markersArray.length; i++) {
        markersArray[i].setMap(null);
      }
      markersArray = [];
    }

    // 3. 키워드 검색 요청 함수
    function searchPlaces() {
      const keyword = document.getElementById('keyword').value;

      if (!keyword.replace(/^\s+|\s+$/g, '')) {
        alert('키워드를 입력해주세요!');
        return false;
      }

      // 카카오맵 키워드 검색 서비스 호출
      placeService.keywordSearch(keyword, placesSearchCB);
    }

    // 4. 키워드 검색 완료 시 호출되는 콜백 함수
    function placesSearchCB(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        // 정상적으로 검색이 완료됐으면 리스트와 마커 표시
        displayPlaces(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 결과 중 오류가 발생했습니다.');
      }
    }

    // 5. 검색 결과 목록과 마커를 표출하는 함수
    function displayPlaces(places) {
      const listEl = document.getElementById('placesList');
      const bounds = new kakao.maps.LatLngBounds();
      
      // 기존 검색 결과 리스트 및 마커, 인포윈도우 초기화
      listEl.innerHTML = '';
      clearMarkers();
      infoWindowObject.close();

      for (let i = 0; i < places.length; i++) {
        const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
        
        // 지도에 마커 추가하고 변수에 저장
        const marker = displayMarker(placePosition, places[i].place_name);
        
        // 검색 결과 HTML 아이템 만들기
        const itemEl = document.createElement('div');
        itemEl.className = 'place-item';
        itemEl.innerHTML = `
          <h5>${places[i].place_name}</h5>
          <p>${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</p>
          ${places[i].phone ? `<p style="color: #007bff; margin-top:4px;">${places[i].phone}</p>` : ''}
        `;
        
        // [추가 기능] 리스트의 장소를 클릭하면 해당 위치로 지도가 이동하고 말풍선이 열림
        itemEl.onclick = function() {
          map.setCenter(placePosition);
          map.setLevel(3); // 조금 더 자세히 볼 수 있게 축척 변경
          infoWindowObject.setContent('<div style="padding:5px;font-size:12px;text-align:center;">' + places[i].place_name + '</div>');
          infoWindowObject.open(map, marker);
        };
        
        listEl.appendChild(itemEl);
        
        // 검색된 장소들을 포함할 수 있도록 지도 범위 확장 기준 설정
        bounds.extend(placePosition);
      }

      // 검색된 장소들이 다 보이도록 지도 시점 변경
      map.setBounds(bounds);
    }
  </script>
</body>
</html>
