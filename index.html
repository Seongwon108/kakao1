<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중고 거래 안전 구역 지도</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .tab-container {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .tab-button {
            flex: 1;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            text-align: center;
        }
        .tab-button.active {
            background-color: #ffffff;
            color: #212529;
            border-bottom: 3px solid #fee500; 
        }
        
        /* ✨ 새로 추가된 키워드 검색창 스타일 */
        .search-box-container {
            padding: 12px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 6px;
        }
        .search-input {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
        }
        .search-input:focus {
            border-color: #fee500;
        }
        .search-button {
            padding: 8px 14px;
            background-color: #fee500;
            border: 1px solid #e2cb00;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .search-button:hover {
            background-color: #fada00;
        }

        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .result-item {
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .result-item:hover {
            background-color: #e9ecef;
        }
        .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .place-address {
            font-size: 13px;
            color: #6c757d;
        }
        .place-distance {
            font-size: 12px;
            color: #007bff;
            margin-top: 4px;
        }
        .map-area {
            flex: 1;
            height: 100%;
        }
        .custom-overlay {
            position: relative;
            bottom: 50px;
            border-radius: 6px;
            border: 1px solid #ccc;
            border-bottom: 2px solid #ddd;
            background-color: #fff;
            box-shadow: 0px 1px 5px rgba(0,0,0,0.2);
            padding: 10px;
            font-size: 12px;
            white-space: nowrap;
        }
        .custom-overlay .title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            color: #212529;
        }
        .custom-overlay .info {
            color: #6c757d;
            margin-bottom: 6px;
        }
        .custom-overlay .link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .custom-overlay .link:hover {
            text-decoration: underline;
        }
        .custom-overlay:after {
            content: '';
            position: absolute;
            margin-left: -8px;
            left: 50%;
            bottom: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 0;
            border-color: #ffffff transparent transparent;
        }
    </style>
    <!-- 카카오 지도를 가져오기 위한 스크립트 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a9f1fed1451c1938e05ae1dbae763e15
&libraries=services"></script>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 사이드바 -->
        <div class="sidebar">
            <div class="tab-container">
                <!-- ✨ 탭 텍스트 및 목적 변경 -->
                <button id="tabSearch" class="tab-button active" onclick="changeTab('search', 'tabSearch')">자유 키워드 검색</button>
                <button id="tabDistance" class="tab-button" onclick="changeTab('police', 'tabDistance')">거리순 나열 (경찰서)</button>
            </div>
            
            <!-- ✨ 새로 추가된 키워드 입력 영역 (기본적으로 노출됨) -->
            <div id="searchBoxContainer" class="search-box-container">
                <input type="text" id="keywordInput" class="search-input" placeholder="검색할 장소를 입력하세요 (예: 편의점, CU)" onkeydown="if(event.keyCode==13) executeSearch()">
                <button class="search-button" onclick="executeSearch()">검색</button>
            </div>

            <div id="resultList" class="result-list"></div>
        </div>

        <!-- 오른쪽 지도 영역 -->
        <div id="map" class="map-area"></div>
    </div>

    <script>
        // 전역 변수 설정
        let map;
        let placeService;
        let userLatitude = 37.566826; 
        let userLongitude = 126.9786567; 
        let userLocationLatLng;
        let userMarker = null; 
        let activeMarkers = []; 
        let activeOverlay = null; 
        let currentPlaces = []; 
        
        // ✨ 탭 상태 관리용 변수 ('search' 또는 'police')
        let currentMode = 'search'; 

        const blueMarkerImageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png'; 
        const redMarkerImageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png'; 

        window.onload = function() {
            initMap();
        };

        function initMap() {
            const mapContainer = document.getElementById('map');
            const mapOptions = {
                center: new kakao.maps.LatLng(userLatitude, userLongitude),
                level: 3
            };
            
            map = new kakao.maps.Map(mapContainer, mapOptions);
            placeService = new kakao.maps.services.Places();

            getUserLocation();
        }

        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    userLatitude = position.coords.latitude;
                    userLongitude = position.coords.longitude;
                    userLocationLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);

                    map.setCenter(userLocationLatLng);
                    displayUserMarker();
                    fetchData(); // 지도 설정 완료 후 모드에 맞춰 데이터 패치
                }, function(error) {
                    alert('현재 위치를 가져올 수 없어 기본 위치로 탐색합니다.');
                    userLocationLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);
                    displayUserMarker();
                    fetchData();
                });
            } else {
                userLocationLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);
                displayUserMarker();
                fetchData();
            }
        }

        function displayUserMarker() {
            if (userMarker !== null) {
                userMarker.setMap(null);
            }

            const imageSize = new kakao.maps.Size(24, 35);
            const markerImage = new kakao.maps.MarkerImage(blueMarkerImageSrc, imageSize);

            userMarker = new kakao.maps.Marker({
                map: map,
                position: userLocationLatLng,
                image: markerImage,
                title: "내 현재 위치"
            });
        }

        // ✨ 핵심: 모드에 따라 알맞은 API를 호출하는 마스터 함수
        function fetchData() {
            clearActiveMarkers();
            if (activeOverlay !== null) {
                activeOverlay.setMap(null);
            }

            if (currentMode === 'search') {
                // 1) 자유 검색 모드: 사용자가 입력한 텍스트 기준 검색
                const keyword = document.getElementById('keywordInput').value.trim();
                if (!keyword) {
                    document.getElementById('resultList').innerHTML = '<div style="padding:15px; color:#666;">검색어를 입력창에 넣고 검색을 진행해주세요.</div>';
                    return;
                }
                
                // 키워드 검색 API 호출 (정확도 순)
                placeService.keywordSearch(keyword, searchCallback, {
                    location: userLocationLatLng,
                    radius: 2000
                });

            } else if (currentMode === 'police') {
                // 2) 경찰서 거리순 모드: PO5(공공기관) 카테고리 중 '경찰서' 키워드 지정 탐색
                // 거리순(DISTANCE) 정렬 옵션 필수 적용
                placeService.keywordSearch('경찰서', searchCallback, {
                    location: userLocationLatLng,
                    radius: 3000, // 탐색 범위 3km로 확장
                    sort: kakao.maps.services.SortBy.DISTANCE 
                });
            }
        }

        // 키워드 검색창에서 엔터나 버튼을 누르면 강제 데이터 패치 실행
        function executeSearch() {
            if (currentMode !== 'search') {
                // 만약 경찰서 탭에 있다가 검색어를 치면 자동으로 검색 탭으로 전환해주는 편의성 코드
                changeTab('search', 'tabSearch');
            } else {
                fetchData();
            }
        }

        function searchCallback(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                renderPlaceList(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                document.getElementById('resultList').innerHTML = '<div style="padding:15px; color:#666;">주변에 조건에 맞는 정보가 없습니다.</div>';
                currentPlaces = [];
            } else {
                alert('데이터를 가져오는 중 오류가 발생했습니다.');
            }
        }

        function renderPlaceList(places) {
            const listContainer = document.getElementById('resultList');
            let listContentHtml = '';
            const mapBounds = new kakao.maps.LatLngBounds();

            currentPlaces = places; 

            mapBounds.extend(userLocationLatLng);

            for (let i = 0; i < places.length; i++) {
                const placeLatLng = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                createSafeMarker(placeLatLng, places[i]);
                mapBounds.extend(placeLatLng);

                listContentHtml += `
                    <div class="result-item" onclick="panToPlace(${i})">
                        <div class="place-name">${places[i].place_name}</div>
                        <div class="place-address">${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</div>
                        <div class="place-distance">내 위치로부터 ${places[i].distance}m</div>
                    </div>
                `;
            }

            listContainer.innerHTML = listContentHtml;
            map.setBounds(mapBounds);
        }

        function createSafeMarker(position, placeData) {
            const imageSize = new kakao.maps.Size(24, 35);
            const markerImage = new kakao.maps.MarkerImage(redMarkerImageSrc, imageSize);

            const marker = new kakao.maps.Marker({
                map: map,
                position: position,
                image: markerImage
            });

            activeMarkers.push(marker);

            kakao.maps.event.addListener(marker, 'click', function() {
                showOverlay(placeData, position);
            });
        }

        function showOverlay(placeData, position) {
            if (activeOverlay !== null) {
                activeOverlay.setMap(null);
            }

            const overlayContent = `
                <div class="custom-overlay">
                    <div class="title">${placeData.place_name}</div>
                    <div class="info">분류: ${placeData.category_name.split(' > ').pop()}</div>
                    <a href="${placeData.place_url}" target="_blank" class="link">카카오맵에서 상세 보기 →</a>
                </div>
            `;

            activeOverlay = new kakao.maps.CustomOverlay({
                content: overlayContent,
                position: position,
                xAnchor: 0.5,
                yAnchor: 1.0
            });

            activeOverlay.setMap(map);
        }

        function clearActiveMarkers() {
            for (let i = 0; i < activeMarkers.length; i++) {
                activeMarkers[i].setMap(null);
            }
            activeMarkers = [];
        }

        function panToPlace(index) {
            const place = currentPlaces[index];
            if (!place) return;

            const destinationLatLng = new kakao.maps.LatLng(place.y, place.x);
            map.panTo(destinationLatLng);
            showOverlay(place, destinationLatLng);
        }

        // ✨ 탭 전환 함수 대폭 수정
        function changeTab(mode, tabId) {
            currentMode = mode;

            // 탭 활성화 UI 전환
            const tabButtons = document.getElementsByClassName('tab-button');
            for (let i = 0; i < tabButtons.length; i++) {
                tabButtons[i].classList.remove('active');
            }
            document.getElementById(tabId).classList.add('active');

            // UI 제어: 검색 모드일 때만 안내 텍스트 변경 처리 혹은 검색 인풋창 포커싱
            const searchBox = document.getElementById('searchBoxContainer');
            const keywordInput = document.getElementById('keywordInput');
            
            if (mode === 'search') {
                keywordInput.disabled = false;
                keywordInput.placeholder = "검색할 장소를 입력하세요 (예: 편의점, CU)";
                keywordInput.focus();
            } else if (mode === 'police') {
                keywordInput.disabled = true;
                keywordInput.placeholder = "🚨 현재 경찰서 거리순 정렬 상태입니다.";
                keywordInput.value = ""; // 입력값 초기화
            }

            // 바뀐 모드로 데이터 새로 로딩
            fetchData();
        }
    </script>
</body>
</html>
