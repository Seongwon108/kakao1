<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중고 거래 안전 구역 지도</title>
    <style>
        /* 기본 스타일 초기화 및 화면 전체 사용 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽 사이드바 (탭 + 검색 결과 리스트) */
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 탭 메뉴 디자인 */
        .tab-menu {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .tab-button {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            color: #6c757d;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .tab-button.active {
            color: #212529;
            border-bottom: 3px solid #fee500; /* 카카오 시그니처 옐로우 */
            background-color: #fffdf0;
        }

        /* 검색 결과 리스트 영역 (스크롤 가능) */
        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .result-item {
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .result-item:hover {
            background-color: #e9ecef;
        }
        .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .place-address {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 4px;
        }
        .place-phone {
            font-size: 12px;
            color: #28a745;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
        }

        /* 커스텀 오버레이 (말풍선) 스타일 */
        .custom-overlay {
            position: relative;
            bottom: 50px;
            border-radius: 6px;
            border: 1px solid #ccc;
            border-bottom: 2px solid #ddd;
            background-color: #fff;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            font-size: 13px;
            white-space: nowrap;
        }
        .custom-overlay .title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: #000;
        }
        .custom-overlay .body {
            color: #555;
            margin-bottom: 5px;
        }
        .custom-overlay .link {
            color: #007bff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
        .custom-overlay .link:hover {
            text-decoration: underline;
        }
        /* 말풍선 아래쪽 꼬리 화살표 */
        .custom-overlay:after {
            content: '';
            position: absolute;
            margin-left: -8px;
            left: 50%;
            bottom: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 0;
            border-color: #ffffff transparent transparent;
        }
    </style>
    <!-- 카카오맵 API 로드 (services 라이브러리 포함 필수) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_MAPS_API_KEY&libraries=services"></script>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 사이드바 -->
        <div class="sidebar">
            <!-- 안전 구역 카테고리 탭 -->
            <div class="tab-menu">
                <button class="tab-button active" onclick="switchTab('PO8', this)">경찰서</button>
                <button class="tab-button" onclick="switchTab('OG7', this)">공공기관</button>
            </div>
            <!-- 결과 리스트 -->
            <div id="resultList" class="result-list">
                <!-- 자바스크립트로 검색 결과가 동적 삽입됩니다 -->
            </div>
        </div>

        <!-- 오른쪽 지도 영역 -->
        <div id="map" class="map-area"></div>
    </div>

    <script>
        // 전역 변수 선언
        let map;
        let placeService;
        let currentPosition = new kakao.maps.LatLng(37.566826, 126.9786567); // 기본 위치 (서울시청)
        let safeMarkers = []; // 안전 구역 마커들을 저장할 배열
        let currentOverlay = null; // 현재 열려있는 커스텀 오버레이
        let currentCategory = 'PO8'; // 현재 선택된 카테고리 (기본값: 경찰서)

        // 마커 이미지 설정 (카카오 기본 마커 대신 색상 구분)
        const redMarkerImg = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png'; // 안전 구역용 빨간 별/마커 대용
        const blueMarkerImg = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png'; // 내 위치용 파란 마커

        // 페이지 로드 시 실행
        window.onload = function() {
            initMap();
            getGeoLocation();
        };

        // 지도 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map');
            const mapOptions = {
                center: currentPosition,
                level: 4
            };
            map = new kakao.maps.Map(mapContainer, mapOptions);
            placeService = new kakao.maps.services.Places(map);
        }

        // 사용자의 현재 위치를 가져오는 함수
        function getGeoLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    currentPosition = new kakao.maps.LatLng(lat, lon);
                    
                    // 지도 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);

                    // 내 위치 파란색 마커로 표시
                    const imageSize = new kakao.maps.Size(24, 35);
                    const markerImage = new kakao.maps.MarkerImage(blueMarkerImg, imageSize);
                    
                    const userMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "내 현재 위치",
                        image: markerImage
                    });

                    // 초기 카테고리 검색 수행
                    searchSafeZone();
                }, function(error) {
                    console.error("위치 정보를 가져오는데 실패했습니다.", error);
                    // 실패해도 기본 위치 기준으로 검색 수행
                    searchSafeZone();
                });
            } else {
                searchSafeZone();
            }
        }

        // 안전 구역(카테고리) 검색 함수
        function searchSafeZone() {
            // 기존 마커 및 오버레이 지우기
            removeSafeMarkers();
            if (currentOverlay) {
                currentOverlay.setMap(null);
            }

            // 내 위치 주변의 카테고리 장소 검색 (반경 2000m 설정)
            placeService.categorySearch(currentCategory, searchCallback, {
                location: currentPosition,
                radius: 2000,
                useMapCenter: false
            });
        }

        // 검색 완료 시 호출되는 콜백 함수
        function searchCallback(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                document.getElementById('resultList').innerHTML = '<div style="padding:20px; text-align:center; color:#666;">주변에 안전 구역이 없습니다.</div>';
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 결과를 사이드바에 표시하고 마커를 지도에 찍는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('resultList');
            const bounds = new kakao.maps.LatLngBounds();
            let listHtml = '';

            // 내 위치도 포함해서 지도가 포커싱되도록 설정
            bounds.extend(currentPosition);

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 빨간색 마커 생성 및 지도 표시
                const marker = addSafeMarker(placePosition, places[i]);
                bounds.extend(placePosition);

                // 왼쪽 결과 리스트 아이템 HTML 구성
                listHtml += `
                    <div class="result-item" onclick="focusPlace(${places[i].y}, ${places[i].x}, ${i})">
                        <div class="place-name">${places[i].place_name}</div>
                        <div class="place-address">${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</div>
                        ${places[i].phone ? `<div class="place-phone">${places[i].phone}</div>` : ''}
                    </div>
                `;
            }

            listEl.innerHTML = listHtml;
            
            // 마커들이 다 보이도록 지도 범위 재조정
            map.setBounds(bounds);
        }

        // 안전 구역 마커(빨간색 변형)를 추가하는 함수
        function addSafeMarker(position, placeData) {
            // 카카오 공식 스타 마커 이미지(빨간색 계열 효과)를 활용
            const imageSize = new kakao.maps.Size(24, 35);
            const markerImage = new kakao.maps.MarkerImage(redMarkerImg, imageSize);

            const marker = new kakao.maps.Marker({
                position: position,
                image: markerImage,
                map: map
            });

            // 마커 배열에 저장 (나중에 지우기 위함)
            safeMarkers.push(marker);

            // 마커 클릭 시 커스텀 오버레이 표시 이벤트 등록
            kakao.maps.event.addListener(marker, 'click', function() {
                openOverlay(placeData, position);
            });

            return marker;
        }

        // 커스텀 오버레이(말풍선)를 여는 함수
        function openOverlay(placeData, position) {
            // 기존에 열려있는 오버레이가 있다면 닫기
            if (currentOverlay) {
                currentOverlay.setMap(null);
            }

            // 카카오 API에서는 영업시간을 제공하지 않으므로, 주소 혹은 전화번호 정보를 대신 깔끔하게 배치하거나 상세페이지 링크 유도
            const content = `
                <div class="custom-overlay" onclick="event.stopPropagation()">
                    <div class="title">${placeData.place_name}</div>
                    <div class="body">
                        ${placeData.road_address_name ? placeData.road_address_name : placeData.address_name}<br>
                        ${placeData.phone ? `전화: ${placeData.phone}` : '전화번호 정보 없음'}
                    </div>
                    <a href="${placeData.place_url}" target="_blank" class="link">카카오맵 바로가기 →</a>
                </div>
            `;

            currentOverlay = new kakao.maps.CustomOverlay({
                content: content,
                position: position,
                xAnchor: 0.5,
                yAnchor: 1.0
            });

            currentOverlay.setMap(map);
            map.panTo(position);
        }

        // 지도에서 안전 구역 마커들을 전부 삭제하는 함수
        function removeSafeMarkers() {
            for (let i = 0; i < safeMarkers.length; i++) {
                safeMarkers[i].setMap(null);
            }
            safeMarkers = [];
        }

        // 왼쪽 리스트 아이템 클릭 시 해당 장소로 이동 및 오버레이 오픈
        function focusPlace(lat, lon, index) {
            const moveLatLng = new kakao.maps.LatLng(lat, lon);
            // 클릭한 인덱스의 마커를 기준으로 오버레이 열기 동작을 강제 실행할 수는 없으므로 데이터 직접 전달
            // 대신 보관하고 있던 해당 마커를 기반으로 이벤트를 트리거하거나 직접 함수 실행
            placeService.categorySearch(currentCategory, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    openOverlay(data[index], moveLatLng);
                }
            }, { location: currentPosition, radius: 2000 });
        }

        // 탭 전환 함수
        function switchTab(categoryCode, element) {
            // 탭 버튼 활성화 스타일 변경
            const buttons = document.getElementsByClassName('tab-button');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            element.classList.add('active');

            // 카테고리 코드 변경 후 새롭게 검색
            currentCategory = categoryCode;
            searchSafeZone();
        }
    </script>
</body>
</html>
