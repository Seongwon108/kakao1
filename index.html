<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중고 거래 안전 구역 지도</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .tab-container {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .tab-button {
            flex: 1;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            text-align: center;
        }
        .tab-button.active {
            background-color: #ffffff;
            color: #212529;
            border-bottom: 3px solid #fee500; 
        }
        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .result-item {
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .result-item:hover {
            background-color: #e9ecef;
        }
        .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #212529;
            margin-bottom: 4px;
        }
        .place-address {
            font-size: 13px;
            color: #6c757d;
        }
        .place-distance {
            font-size: 12px;
            color: #007bff;
            margin-top: 4px;
        }
        .map-area {
            flex: 1;
            height: 100%;
        }
        .custom-overlay {
            position: relative;
            bottom: 50px;
            border-radius: 6px;
            border: 1px solid #ccc;
            border-bottom: 2px solid #ddd;
            background-color: #fff;
            box-shadow: 0px 1px 5px rgba(0,0,0,0.2);
            padding: 10px;
            font-size: 12px;
            white-space: nowrap;
        }
        .custom-overlay .title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            color: #212529;
        }
        .custom-overlay .info {
            color: #6c757d;
            margin-bottom: 6px;
        }
        .custom-overlay .link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .custom-overlay .link:hover {
            text-decoration: underline;
        }
        .custom-overlay:after {
            content: '';
            position: absolute;
            margin-left: -8px;
            left: 50%;
            bottom: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 0;
            border-color: #ffffff transparent transparent;
        }
    </style>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a9f1fed1451c1938e05ae1dbae763e15
&libraries=services"></script>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="tab-container">
                <button id="tabSearch" class="tab-button active" onclick="changeCategory('CS2', 'tabSearch')">검색기능 (편의점)</button>
                <button id="tabDistance" class="tab-button" onclick="changeCategory('HP8', 'tabDistance')">거리 순 나열 (병원)</button>
            </div>
            <div id="resultList" class="result-list"></div>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script>
        // 전역 변수 설정
        let map;
        let placeService;
        let userLatitude = 37.566826; 
        let userLongitude = 126.9786567; 
        let userLocationLatLng;
        let userMarker = null; 
        let activeMarkers = []; 
        let activeOverlay = null; 
        let selectedCategory = 'CS2'; 
        let currentPlaces = []; // ✨ 검색된 장소 데이터를 보관할 배열 추가

        const blueMarkerImageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png'; 
        const redMarkerImageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png'; 

        window.onload = function() {
            initMap();
        };

        function initMap() {
            const mapContainer = document.getElementById('map');
            const mapOptions = {
                center: new kakao.maps.LatLng(userLatitude, userLongitude),
                level: 3
            };
            
            map = new kakao.maps.Map(mapContainer, mapOptions);
            placeService = new kakao.maps.services.Places();

            getUserLocation();
        }

        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    userLatitude = position.coords.latitude;
                    userLongitude = position.coords.longitude;
                    userLocationLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);

                    map.setCenter(userLocationLatLng);
                    displayUserMarker();
                    fetchSafeZones();
                }, function(error) {
                    alert('현재 위치를 가져올 수 없어 기본 위치로 탐색합니다.');
                    userLocationLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);
                    displayUserMarker();
                    fetchSafeZones();
                });
            } else {
                userLocationLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);
                displayUserMarker();
                fetchSafeZones();
            }
        }

        function displayUserMarker() {
            if (userMarker !== null) {
                userMarker.setMap(null);
            }

            const imageSize = new kakao.maps.Size(24, 35);
            const markerImage = new kakao.maps.MarkerImage(blueMarkerImageSrc, imageSize);

            userMarker = new kakao.maps.Marker({
                map: map,
                position: userLocationLatLng,
                image: markerImage,
                title: "내 현재 위치"
            });
        }

        function fetchSafeZones() {
            clearActiveMarkers();
            if (activeOverlay !== null) {
                activeOverlay.setMap(null);
            }

            placeService.categorySearch(selectedCategory, searchCallback, {
                location: userLocationLatLng,
                radius: 2000,
                sort: kakao.maps.services.SortBy.ACCURACY 
            });
        }

        function searchCallback(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                renderPlaceList(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                document.getElementById('resultList').innerHTML = '<div style="padding:15px; color:#666;">주변에 안전 구역 정보가 없습니다.</div>';
                currentPlaces = []; // 결과가 없을 때는 비워줌
            } else {
                alert('데이터를 가져오는 중 오류가 발생했습니다.');
            }
        }

        function renderPlaceList(places) {
            const listContainer = document.getElementById('resultList');
            let listContentHtml = '';
            const mapBounds = new kakao.maps.LatLngBounds();

            currentPlaces = places; // ✨ 전역 변수에 현재 보여지는 데이터 동기화

            mapBounds.extend(userLocationLatLng);

            for (let i = 0; i < places.length; i++) {
                const placeLatLng = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                createSafeMarker(placeLatLng, places[i]);
                mapBounds.extend(placeLatLng);

                // ✨ onclick 함수 호출 시 매개변수를 index 하나만 넘기도록 간소화
                listContentHtml += `
                    <div class="result-item" onclick="panToPlace(${i})">
                        <div class="place-name">${places[i].place_name}</div>
                        <div class="place-address">${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</div>
                        <div class="place-distance">내 위치로부터 ${places[i].distance}m</div>
                    </div>
                `;
            }

            listContainer.innerHTML = listContentHtml;
            map.setBounds(mapBounds);
        }

        function createSafeMarker(position, placeData) {
            const imageSize = new kakao.maps.Size(24, 35);
            const markerImage = new kakao.maps.MarkerImage(redMarkerImageSrc, imageSize);

            const marker = new kakao.maps.Marker({
                map: map,
                position: position,
                image: markerImage
            });

            activeMarkers.push(marker);

            kakao.maps.event.addListener(marker, 'click', function() {
                showOverlay(placeData, position);
            });
        }

        function showOverlay(placeData, position) {
            if (activeOverlay !== null) {
                activeOverlay.setMap(null);
            }

            const overlayContent = `
                <div class="custom-overlay">
                    <div class="title">${placeData.place_name}</div>
                    <div class="info">영업시간: 링크 참조 (클릭)</div>
                    <a href="${placeData.place_url}" target="_blank" class="link">카카오맵에서 상세 보기 →</a>
                </div>
            `;

            activeOverlay = new kakao.maps.CustomOverlay({
                content: overlayContent,
                position: position,
                xAnchor: 0.5,
                yAnchor: 1.0
            });

            activeOverlay.setMap(map);
        }

        function clearActiveMarkers() {
            for (let i = 0; i < activeMarkers.length; i++) {
                activeMarkers[i].setMap(null);
            }
            activeMarkers = [];
        }

        // ✨ 수정된 리스트 아이템 클릭 함수
        function panToPlace(index) {
            const place = currentPlaces[index];
            if (!place) return;

            const destinationLatLng = new kakao.maps.LatLng(place.y, place.x);
            
            // 지도 중심 이동
            map.panTo(destinationLatLng);

            // 추가 네트워킹(API 요청) 없이 기존 데이터로 즉시 오버레이 출력
            showOverlay(place, destinationLatLng);
        }

        function changeCategory(categoryCode, tabId) {
            selectedCategory = categoryCode;

            const tabButtons = document.getElementsByClassName('tab-button');
            for (let i = 0; i < tabButtons.length; i++) {
                tabButtons[i].classList.remove('active');
            }
            document.getElementById(tabId).classList.add('active');

            fetchSafeZones();
        }
    </script>
</body>
</html>
